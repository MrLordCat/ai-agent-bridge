version: 2
updates:
  - package-ecosystem: "npm"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
    open-pull-requests-limit: 5
    labels:
      - "dependencies"
    versioning-strategy: increase
    groups:
      npm-prod:
        dependency-type: "production"
        patterns:
          - "*"
      npm-dev:
        dependency-type: "development"
        patterns:
          - "*"
    ignore:
      # TypeScript 7 is not supported by typescript-eslint 8.x yet; the
      # 2026-08-15 dev-group bump to 7.0.2 broke npm ci (ERESOLVE).
      # Remove this rule once typescript-eslint supports TS 7.
      - dependency-name: "typescript"
        versions: ">=6"
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
