name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  release:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm test
      - run: npm run package -- --out llama-vscode-chat-${{ github.ref_name }}.vsix
      - run: gh release create "${{ github.ref_name }}" "llama-vscode-chat-${{ github.ref_name }}.vsix" --notes-file docs/RELEASE_NOTES.md --verify-tag
        env:
          GH_TOKEN: ${{ github.token }}
