name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    uses: ./.github/workflows/verify.yml
    with:
      package-prefix: llama-vscode-chat-${{ github.ref_name }}

  release:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
      - uses: actions/download-artifact@v8
        with:
          pattern: vsix-*
          merge-multiple: true
      - run: gh release create "${{ github.ref_name }}" ./*.vsix --title "AI Agent Bridge ${{ github.ref_name }}" --notes-file docs/RELEASE_NOTES.md --verify-tag
        env:
          GH_TOKEN: ${{ github.token }}
