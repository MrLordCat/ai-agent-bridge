name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  verify:
    # The extension is Windows-only (native Claude/Codex runtimes ship for
    # win32-x64) and the agent-host patch patterns are validated against the
    # VS Code 1.131 bundle.
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm test
      - run: npm run package -- --out llama-vscode-chat.vsix
      - uses: actions/upload-artifact@v7
        with:
          name: llama-vscode-chat-vsix
          path: llama-vscode-chat.vsix
